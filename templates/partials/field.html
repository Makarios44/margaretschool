{% if field.widget_type == "checkbox" %}
<div class="{{ col|default:'col-md-6 col-lg-4' }} d-flex align-items-end">
  <div class="mb-1">
    <div class="form-check">
      {{ field }}
      <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    </div>
    {% for e in field.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
  </div>
</div>
{% else %}
<div class="{{ col|default:'col-md-6 col-lg-4' }}">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
</div>
{% endif %}
